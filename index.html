<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Audio Vocabulary Sprint v3.16</title>
<link rel="stylesheet" href="css/style.css?v=3.16">
</head>
<body>
<main>
<div class="top">
 <div><h1>Audio Vocabulary Sprint</h1><div class="sub">v3.16</div></div>
 <div class="stats"><span id="mastered">0</span> mastered<br><span id="active">0</span> active · <span id="unseen">0</span> unseen</div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="card">
 <button class="undoBtn" id="undoBtn" type="button" disabled aria-label="撤回上一步">↶ 撤回</button>
 <div>
  <div class="listen">
   <div class="speakerNav">
    <button class="voiceArrow" id="voicePrev" type="button" aria-label="上一个语音">‹</button>
    <button class="speaker" id="speak" aria-label="播放发音">🔊</button>
    <button class="voiceArrow" id="voiceNext" type="button" aria-label="下一个语音">›</button>
   </div>
   <div class="voiceInfo" id="voiceInfo"></div>
   <div class="hint" id="hint">点击喇叭开始；之后每个词会自动播放</div>
  </div>
  <div class="answer" id="answer"></div><canvas id="wordDissolveFx" aria-hidden="true"></canvas>
 </div>
 <div>
  <div class="revealControls" id="revealControls">
   <button class="action revealAction" id="reveal">显示答案</button>
  </div>
  <div class="actions" id="judgmentActions" hidden>
   <button class="action" id="pass">✨ PASS</button>
   <button class="action again" id="again">↻ AGAIN</button>
  </div>
  <div class="utilityRow">
   <button class="utilityLink" id="info">规则 / 进度</button>
   <button class="utilityLink" id="syncBtn">同步</button>
   <details class="moreTools">
    <summary aria-label="更多工具">•••</summary>
    <div class="moreToolsMenu">
     <label class="moreToolItem importBtn" for="importWordsFile">导入新词表<input id="importWordsFile" type="file" accept=".txt,text/plain" style="display:none"></label>
     <button class="moreToolItem dangerLite" id="reset">重置本机</button>
    </div>
   </details>
  </div>
 </div>
</section>
</main>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
<div class="overlay" id="syncOverlay" style="display:none">
  <div class="panel">
    <div class="panel-head">
      <div>
        <h2 style="margin:0">GitHub Sync</h2>
        <div class="sub">Private repo · progress.json</div>
      </div>
      <button class="small" id="syncClose">关闭</button>
    </div>

    <div class="sync-box">
      <div class="sync-status sync-last" id="lastSyncInfo">上次同步：尚未同步</div>

      <div class="sync-row">
        <button class="action" id="syncUpload">↑ 上传到 GitHub</button>
        <button class="action" id="syncDownload">↓ 从 GitHub 下载</button>
      </div>

      <div class="sync-status" id="syncStatus">尚未同步</div>

      <details style="margin-top:16px">
        <summary>🔑 Token 设置</summary>
        <div style="margin-top:12px">
          <input id="syncTokenInput" type="password" autocomplete="off"
                 placeholder="粘贴 fine-grained token"
                 style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7dbe0;border-radius:12px;font-size:15px;">
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="small" id="syncSaveToken">保存 Token</button>
            <button class="small" id="syncClearToken">清除 Token</button>
          </div>
          <div class="sub" style="margin-top:8px">
            Token 只保存在此浏览器的 localStorage 中，不会写入网页源码或 progress.json。
          </div>
        </div>
      </details>

      <div class="sub" style="margin-top:16px;line-height:1.55">
        ↑ 当前设备 → GitHub。<br>
        ↓ GitHub → 当前设备；下载前自动保存一份本地备份。
      </div>
    </div>
  </div>
</div>

<script src="data/vocabulary.js?v=3.16"></script>
<script src="js/storage.js?v=3.16"></script>
<script src="js/scheduler.js?v=3.16"></script>
<script src="js/app.js?v=3.16"></script>
<script src="js/github-sync.js?v=3.16"></script>



</body></html>
