<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Audio Vocabulary Sprint Mobile v2.1</title>
<style>
:root { --bg:#f6f5f1; --card:#fff; --text:#1d1d1f; --muted:#777; --line:#ddd; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
main{max-width:720px;margin:0 auto;padding:28px 18px 50px}
.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
h1{font-size:22px;margin:0 0 5px}.sub{font-size:13px;color:var(--muted)}
.stats{font-size:13px;color:var(--muted);text-align:right;line-height:1.6}
.card{margin-top:22px;background:var(--card);border-radius:24px;padding:30px 22px;min-height:430px;box-shadow:0 5px 25px rgba(0,0,0,.05);display:flex;flex-direction:column;justify-content:space-between}
.listen{text-align:center;padding-top:20px}
.speaker{width:112px;height:112px;border-radius:56px;border:0;font-size:44px;background:#eee;cursor:pointer}
.hint{margin-top:15px;color:var(--muted);font-size:14px}
.answer{margin:26px auto 0;max-width:520px;text-align:center;min-height:115px}
.word{font-size:34px;font-weight:700;letter-spacing:.2px;word-break:break-word}
.level{margin-top:8px;color:var(--muted);font-size:14px}
.note{margin-top:13px;font-size:13px;color:#999}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:25px}
button.action{height:64px;border-radius:18px;border:1px solid var(--line);font-size:18px;font-weight:650;background:#fff;cursor:pointer}
button.again{background:#222;color:white;border-color:#222}
button:active{transform:scale(.985)}
.controls{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.small{border:0;background:transparent;color:#666;padding:8px 10px;cursor:pointer;font-size:13px}
.progress{height:6px;background:#e4e4e4;border-radius:5px;margin-top:18px;overflow:hidden}
.bar{height:100%;background:#222;width:0%}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px}
.panel{background:#fff;border-radius:22px;padding:24px;max-width:480px;width:100%;max-height:80vh;overflow:auto}
.panel h2{margin-top:0}.panel p,.panel li{font-size:14px;line-height:1.55;color:#555}.masterRow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #eee;font-size:14px}.miniBtn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:6px 9px;cursor:pointer;font-size:12px}
@media(max-width:500px){main{padding-top:18px}.card{min-height:390px}.speaker{width:100px;height:100px}.word{font-size:30px}}

/* Mobile v1: iPhone/Safari touch layout */
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{
  min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
main{
  max-width:620px;
  padding:
    calc(18px + env(safe-area-inset-top))
    max(14px, env(safe-area-inset-right))
    calc(28px + env(safe-area-inset-bottom))
    max(14px, env(safe-area-inset-left));
}
.card{
  margin-top:16px;
  min-height:min(560px,calc(100dvh - 145px));
  padding:24px 16px 18px;
}
.speaker{
  width:118px;height:118px;border-radius:59px;
  touch-action:manipulation;
}
.actions{gap:12px;margin-top:20px}
button.action{
  height:70px;
  font-size:20px;
  border-radius:20px;
  touch-action:manipulation;
}
.controls{gap:5px 8px;margin-top:14px}
.small{
  min-height:42px;
  padding:10px 9px;
  font-size:13px;
  touch-action:manipulation;
}
.overlay{
  padding:
    calc(14px + env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    calc(14px + env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));
}
.panel{max-height:86dvh}
@media(max-width:500px){
  main{padding-top:calc(14px + env(safe-area-inset-top))}
  .top{align-items:flex-start;gap:8px}
  h1{font-size:20px}
  .sub,.stats{font-size:12px}
  .card{min-height:calc(100dvh - 132px)}
  .listen{padding-top:12px}
  .speaker{width:112px;height:112px}
  .answer{margin-top:22px;min-height:105px}
  .word{font-size:31px}
}


.sync-box{margin-top:18px}
.sync-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sync-row .action{font-size:16px;height:58px}
.sync-status{
  margin-top:14px;padding:12px 14px;border-radius:12px;
  background:#f5f7f9;font-size:13px;line-height:1.5;word-break:break-word
}
@media(max-width:500px){
  .sync-row{grid-template-columns:1fr}
}

</style>
</head>
<body>
<main>
<div class="top">
 <div><h1>Audio Vocabulary Sprint</h1><div class="sub">Mobile v2.1 · 只听声音 → PASS / AGAIN</div></div>
 <div class="stats"><span id="mastered">0</span> mastered<br><span id="active">0</span> active · <span id="unseen">0</span> unseen</div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="card">
 <div>
  <div class="listen">
   <button class="speaker" id="speak" aria-label="播放发音">🔊</button>
   <div class="hint" id="hint">点击喇叭开始；之后每个词会自动播放</div>
  </div>
  <div class="answer" id="answer"></div>
 </div>
 <div>
  <div class="actions">
   <button class="action" id="pass">PASS</button>
   <button class="action again" id="again">AGAIN</button>
  </div>
  <div class="controls">
   <button class="small" id="reveal">显示答案</button>
   <button class="small" id="voice">切换语音</button>
   <button class="small" id="info">规则 / 进度</button>
   <button class="small" id="masteredList">Mastered</button>
   <button class="small" id="export">导出进度</button>
   <label class="small" style="cursor:pointer">导入进度<input id="importFile" type="file" accept=".json,application/json" style="display:none"></label>
   <label class="small" style="cursor:pointer">导入新词表<input id="importWordsFile" type="file" accept=".txt,text/plain" style="display:none"></label>
   <button class="small" id="syncBtn">☁️ 同步</button>
   <button class="small" id="reset">重置全部</button>
  </div>
 </div>
</section>
</main>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>

let state = JSON.parse(localStorage.getItem(KEY)||"null") || {
  debts:{}, mastered:{}, seen:{}, highestDebt:{}, current:null, queue:[], voiceIndex:0
};
// Migrate older saves. Current debt can be recovered; historical peaks from old versions cannot.
state.debts = state.debts || {};
state.mastered = state.mastered || {};
state.seen = state.seen || {};
state.highestDebt = state.highestDebt || {};
for (const [w,d] of Object.entries(state.debts)) {
  state.highestDebt[w] = Math.max(state.highestDebt[w]||0, Number(d)||0);
}
// A brand-new progress state gets a fresh randomized queue.
// Existing progress is preserved exactly as saved.
if (!state.current && (!state.queue || state.queue.length === 0) &&
    Object.keys(state.seen || {}).length === 0) {
  state.queue = WORDS.slice();
  shuffle(state.queue);
}
let voices=[], revealed=false, started=false;

function save(){ localStorage.setItem(KEY,JSON.stringify(state)); updateStats(); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
function eligible(){
  return WORDS.filter(w=>!state.mastered[w]);
}
function refill(){
  // Mix unseen and debt words. Debt words re-enter naturally, but avoid immediate repetition.
  let unseen=WORDS.filter(w=>!state.seen[w]&&!state.mastered[w]);
  let debt=WORDS.filter(w=>(state.debts[w]||0)>0&&!state.mastered[w]);
  shuffle(unseen); shuffle(debt);
  let q=[], ui=0, di=0;
  while(ui<unseen.length || di<debt.length){
    for(let k=0;k<12 && ui<unseen.length;k++) q.push(unseen[ui++]);
    if(di<debt.length) q.push(debt[di++]);
  }
  state.queue=q;
}
function next(){
  speechSynthesis.cancel(); revealed=false;
  document.getElementById("answer").innerHTML="";
  if(!state.queue.length) refill();
  let prev=state.current, guard=0;
  while(state.queue.length && state.queue[0]===prev && guard++<5) state.queue.push(state.queue.shift());
  state.current=state.queue.shift()||null;
  if(!state.current){
    document.getElementById("answer").innerHTML='<div class="word">🎉 全部清零</div>';
    save(); return;
  }
  state.seen[state.current]=true; save();
  setTimeout(speakCurrent,120);
}
function selectedVoice(){
  let en=voices.filter(v=>/^en[-_]/i.test(v.lang));
  if(!en.length) return null;
  return en[state.voiceIndex % en.length];
}
function speakText(text){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(text);
  u.lang="en-US"; u.rate=.86;
  let v=selectedVoice(); if(v) u.voice=v;
  speechSynthesis.speak(u);
}

function reveal(){
  if(!state.current)return;
  revealed=true;
  let d=state.debts[state.current]||0;
  document.getElementById("answer").innerHTML =
    '<div class="word">'+escapeHtml(state.current)+'</div>'+

}
function pass(){
  if(!state.current)return;
  let w=state.current, d=state.debts[w]||0;
  if(d<=1){ delete state.debts[w]; state.mastered[w]=true; }
  else state.debts[w]=d-1;
  revealThenNext("PASS");
}
function again(){
  if(!state.current)return;
  let w=state.current;
  state.debts[w]=(state.debts[w]||0)+1;
  state.highestDebt[w]=Math.max(state.highestDebt[w]||0, state.debts[w]);
  // Put it back later, never immediately.
  let gap=25+Math.floor(Math.random()*26);
  state.queue.splice(Math.min(gap,state.queue.length),0,w);
  revealThenNext("AGAIN");
}
function revealThenNext(kind){
  reveal(); save();
  let el=document.getElementById("hint");

}
function updateStats(){
 let m=Object.keys(state.mastered).length;
 let a=Object.values(state.debts).filter(x=>x>0).length;
 let u=WORDS.filter(w=>!state.seen[w]).length;
 document.getElementById("mastered").textContent=m;

function reAddWord(word){
  if(!state.mastered[word]) return;
  delete state.mastered[word];
  state.debts[word]=1;              // one successful recognition clears this review
  state.seen[word]=true;
  state.highestDebt[word]=Math.max(state.highestDebt[word]||0, 1);
  // Put it into the queue soon, but not necessarily immediately.
  const gap=Math.min(10+Math.floor(Math.random()*16), state.queue.length);
  state.queue.splice(gap,0,word);
  save();
  showMastered();
}
function reAddTop(n){
  const rows=Object.keys(state.mastered)
    .map(w=>[w,state.highestDebt[w]||0])
    .sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]))
    .slice(0,n);
  rows.forEach(([w])=>{
    delete state.mastered[w];
    state.debts[w]=1;
    state.seen[w]=true;
    state.highestDebt[w]=Math.max(state.highestDebt[w]||0,1);
    state.queue.push(w);
  });
  shuffle(state.queue);
  save();
  showMastered();
}

  const rows=Object.keys(state.mastered)
    .map(w=>[w,state.highestDebt[w]||0])
    .sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]));

    '<div class="masterRow"><span>'+escapeHtml(w)+'</span><span>peak '+d+'</span>'+
    '<button class="miniBtn" onclick='+JSON.stringify("reAddWord("+JSON.stringify(w)+")")+'>重新加入</button></div>'
  ).join('') : '<p>还没有 mastered 单词。</p>';
  document.getElementById("panel").innerHTML=
    '<h2>Mastered</h2>'+
    '<p>按历史最高 error debt 降序排列。peak 会永久保留，即使后来清零。</p>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+
    '<button class="miniBtn" onclick="reAddTop(10)">重刷 Top 10</button>'+
    '<button class="miniBtn" onclick="reAddTop(50)">重刷 Top 50</button>'+
    '</div>'+body+
    '<button class="action" style="margin-top:18px;width:100%" onclick="closePanel()">关闭</button>';
  document.getElementById("overlay").style.display="flex";
}

async function exportProgress(){
  const payload = {
    app: "Audio Vocabulary Sprint",
    version: 3,
    exportedAt: new Date().toISOString(),
    totalWords: WORDS.length,
    state: state
  };
  const stamp = new Date().toISOString().slice(0,10);
  const filename = "Audio_Vocabulary_Sprint_progress_"+stamp+".json";
  const json = JSON.stringify(payload,null,2);
  const blob = new Blob([json], {type:"application/json"});

  // iPhone/iPad Safari: Share Sheet lets the user save the JSON directly to Files.
  try{
    if(typeof File !== "undefined" && navigator.share && navigator.canShare){
      const file = new File([blob], filename, {type:"application/json"});
      if(navigator.canShare({files:[file]})){
        await navigator.share({
          files:[file],
          title:"Audio Vocabulary Sprint Progress"
        });
        return;
      }
    }
  }catch(e){
    // User cancelling the share sheet is harmless; fall through only for real failures.
    if(e && e.name === "AbortError") return;
  }

  // Desktop / browsers without file sharing.
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importProgress(file){
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    const incoming = payload && payload.state ? payload.state : payload;
    if(!incoming || typeof incoming!=="object" || !incoming.debts || !incoming.mastered || !incoming.seen){
      throw new Error("Invalid progress file");
    }
    state = {
      debts: incoming.debts || {},
      mastered: incoming.mastered || {},
      seen: incoming.seen || {},
      highestDebt: incoming.highestDebt || {},
      current: incoming.current || null,
      queue: Array.isArray(incoming.queue) ? incoming.queue : [],
      voiceIndex: incoming.voiceIndex || 0
    };
    for (const [w,d] of Object.entries(state.debts)) {
      state.highestDebt[w] = Math.max(state.highestDebt[w]||0, Number(d)||0);
    }
    save();
    speechSynthesis.cancel();
    revealed=false; started=false;
    document.getElementById("answer").innerHTML="";
    document.getElementById("hint").textContent="进度已导入。点击喇叭继续。";
    alert("进度导入成功");
  }catch(e){
    alert("导入失败：这不是有效的进度文件。");
  }
}

function normalizeImportedWords(text){
  const stop = new Set(["a","an","the"]);
  const seen = new Set();
  const words = [];
  text.split(/\r?\n/).forEach(raw=>{
    const w = raw.trim();
    if(!w) return;
    if(w.toLowerCase()==="vc_vocabulary") return;
    const key = w.toLowerCase();
    if(stop.has(key)) return;
    if(seen.has(key)) return;
    seen.add(key);
    words.push(w);
  });
  return words;
}

      const masteredSet=new Set(Object.keys(state.mastered||{}).map(w=>w.toLowerCase()));
      const activeSet=new Set([
        ...Object.keys(state.debts||{}),
        ...(state.queue||[]),
        ...(state.current?[state.current]:[])
      ].map(w=>String(w).toLowerCase()));

      let skippedMastered=0, skippedActive=0;
      const fresh=[];
      const freshKeys=new Set();

      imported.forEach(w=>{
        const k=w.toLowerCase();
        if(masteredSet.has(k)){ skippedMastered++; return; }
        if(activeSet.has(k)){ skippedActive++; return; }
        if(freshKeys.has(k)) return;
        freshKeys.add(k);
        fresh.push(w);
      });

      shuffle(fresh);
      state.queue=(state.queue||[]).concat(fresh);
      save();
      updateStats();

      alert(
        "导入完成：\n"+
        "读取词条 "+imported.length+" 个\n"+
        "新增 "+fresh.length+" 个\n"+
        "自动排除已 Mastered "+skippedMastered+" 个\n"+
        "跳过当前已在学习 "+skippedActive+" 个"
      );
    }catch(e){
      alert("词表导入失败："+e.message);
    }finally{
      ev.target.value="";
    }
  };
  reader.readAsText(file,"utf-8");
};

  if(f) importProgress(f);

};

// ===== GitHub Sync v2 =====
const SYNC = {
  owner: "zzZing0-0",
  repo: "audio-vocabulary-sprint-data",
  path: "progress.json",
  branch: "main",
  tokenKey: "audio_vocab_sprint_github_token",
  backupKey: "audio_vocab_sprint_mobile_v2_backup"
};

function getSyncToken(){
  return localStorage.getItem(SYNC.tokenKey) || "";
}
function setSyncStatus(msg){
  const el = document.getElementById("syncStatus");
  if(el) el.textContent = msg;
}
function syncApiUrl(){
  return `https://api.github.com/repos/${SYNC.owner}/${SYNC.repo}/contents/${SYNC.path}`;
}
function syncHeaders(){
  const token = getSyncToken();
  return {
    "Accept":"application/vnd.github+json",
    "Authorization":"Bearer " + token,
    "X-GitHub-Api-Version":"2022-11-28"
  };
}
function bytesToBase64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for(const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}
function base64ToUtf8(b64){
  const bin = atob(b64.replace(/\n/g,""));
  const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
async function githubGetProgress(){
  const r = await fetch(syncApiUrl(), {headers: syncHeaders()});
  if(r.status === 404) return null;
  if(!r.ok){
    let detail = "";
    try{ detail = (await r.json()).message || ""; }catch(e){}
    throw new Error(`GitHub ${r.status}${detail ? ": "+detail : ""}`);
  }
  return await r.json();
}
async function syncUpload(){
  const token = getSyncToken();
  if(!token){
    alert("请先在 Token 设置里粘贴并保存 token。");
    return;
  }
  setSyncStatus("正在上传…");
  try{
    const existing = await githubGetProgress();
    const payload = {
      app:"Audio Vocabulary Sprint",
      version:4,
      syncedAt:new Date().toISOString(),
      source:"mobile",
      state:state
    };
    const body = {
      message:"Update Audio Vocabulary Sprint progress",
      content:bytesToBase64(JSON.stringify(payload,null,2)),
      branch:SYNC.branch
    };
    if(existing && existing.sha) body.sha = existing.sha;

    const r = await fetch(syncApiUrl(), {
      method:"PUT",
      headers:{...syncHeaders(),"Content-Type":"application/json"},
      body:JSON.stringify(body)
    });
    if(!r.ok){
      let detail = "";
      try{ detail = (await r.json()).message || ""; }catch(e){}
      throw new Error(`GitHub ${r.status}${detail ? ": "+detail : ""}`);
    }
    const now = new Date();
    setSyncStatus("上传成功 · " + now.toLocaleString());
  }catch(e){
    console.error(e);
    setSyncStatus("上传失败 · " + e.message);
    alert("上传失败：\n" + e.message);
  }
}
async function syncDownload(){
  const token = getSyncToken();
  if(!token){
    alert("请先在 Token 设置里粘贴并保存 token。");
    return;
  }
  if(!confirm("从 GitHub 下载会覆盖当前设备进度。\n下载前会自动保存一份本机备份。\n\n继续吗？")) return;

  setSyncStatus("正在下载…");
  try{
    const existing = await githubGetProgress();
    if(!existing || !existing.content){
      throw new Error("云端还没有 progress.json，请先从某台设备上传一次。");
    }
    const txt = base64ToUtf8(existing.content);
    const payload = JSON.parse(txt);
    const incoming = payload.state || payload;

    if(!incoming || typeof incoming !== "object" || !incoming.debts || !incoming.mastered || !incoming.seen){
      throw new Error("progress.json 格式不正确。");
    }

    // one-step local backup before overwrite
    localStorage.setItem(SYNC.backupKey, JSON.stringify({
      backedUpAt:new Date().toISOString(),
      state:state
    }));

    state = incoming;
    state.debts = state.debts || {};
    state.mastered = state.mastered || {};
    state.seen = state.seen || {};
    state.highestDebt = state.highestDebt || {};
    state.queue = Array.isArray(state.queue) ? state.queue : [];
    state.voiceIndex = Number(state.voiceIndex)||0;

    for (const [w,d] of Object.entries(state.debts)) {
      state.highestDebt[w] = Math.max(state.highestDebt[w]||0, Number(d)||0);
    }

    save();
    setSyncStatus("下载成功 · " + new Date().toLocaleString());
    alert("已从 GitHub 下载并覆盖当前设备进度。");
    location.reload();
  }catch(e){
    console.error(e);
    setSyncStatus("下载失败 · " + e.message);
    alert("下载失败：\n" + e.message);
  }
}

document.getElementById("syncClose").onclick = ()=> syncOverlay.style.display = "none";
document.getElementById("syncUpload").onclick = syncUpload;
document.getElementById("syncDownload").onclick = syncDownload;
document.getElementById("syncSaveToken").onclick = ()=>{

  localStorage.setItem(SYNC.tokenKey, v);
  document.getElementById("syncTokenInput").value = "";
  setSyncStatus("Token 已保存到此浏览器。");
};
document.getElementById("syncClearToken").onclick = ()=>{
  localStorage.removeItem(SYNC.tokenKey);
  document.getElementById("syncTokenInput").value = "";
  setSyncStatus("Token 已清除。");
};
