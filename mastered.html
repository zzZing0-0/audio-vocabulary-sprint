(()=>{
  const CURRENT_BUILD="3.31.6";
  async function fresh(){
    try{
      const r=await fetch("index.html?buildcheck="+Date.now(),{cache:"no-store"});
      const h=await r.text();
      const m=h.match(/<meta\s+name=["']app-build["']\s+content=["']([^"']+)["']/i);
      if(m&&m[1]&&m[1]!==CURRENT_BUILD){
        const u=new URL(location.href);u.searchParams.set("v",m[1]);u.searchParams.set("_reload",Date.now());
        location.replace(u.toString());
      }
    }catch(_){}
  }
  addEventListener("pageshow",fresh);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")fresh();});
})();
