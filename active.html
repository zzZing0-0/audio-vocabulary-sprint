<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3.31.7"></head><body><main class="listPage"><div class="listPageHead"><div><h1>🔩 钉子户</h1><div class="sub">当前 Active 词汇</div></div><a class="backLink" href="index.html?v=3.31.7">← 返回背词</a></div><section class="listCard"><div class="listSummary">共 <b id="count">0</b> 个，按 debt 从高到低排列。</div><div id="listRoot"></div><div id="pagination" class="pagination" aria-label="分页"></div></section></main><script src="js/list-pages.js?v=3.31.7"></script><script>renderActive();</script><script>
(()=>{
  const CURRENT_BUILD="3.31.7";
  async function fresh(){
    try{
      const r=await fetch("index.html?buildcheck="+Date.now(),{cache:"no-store"});
      const h=await r.text();
      const m=h.match(/<meta\s+name=["']app-build["']\s+content=["']([^"']+)["']/i);
      if(m&&m[1]&&m[1]!==CURRENT_BUILD){
        const u=new URL(location.href);u.searchParams.set("v",m[1]);u.searchParams.set("_reload",Date.now());
        location.replace(u.toString());
      }
    }catch(_){}
  }
  addEventListener("pageshow",fresh);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")fresh();});
})();
</script></body></html>
