<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="app-build" content="4.1.3"><link rel="stylesheet" href="css/style.css?v=4.1.3"><title>查询词条 · Audio Vocabulary Sprint</title><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=4.1.3">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=4.1.3"><script>if(new URLSearchParams(location.search).get("embed")==="1")document.documentElement.classList.add("lookupEmbedded");</script></head><body><main class="listPage"><div class="listPageHead"><div><h1>查询词条</h1><div class="sub">查询、定向学习或直接加入单个词条</div></div><button class="backLink" id="lookupBackBtn" type="button">← 返回</button></div><section class="listCard lookupCard"><form id="lookupForm" class="lookupSearch"><input id="lookupInput" class="lookupInput" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入单词或词组"><button class="miniBtn" id="lookupSubmit" type="button">查询</button></form><div id="lookupSuggestions" class="lookupSuggestions" hidden></div><div id="lookupResult" class="lookupResult"><div class="lookupEmpty">输入一个单词或词组查询。</div></div></section></main><script src="data/vocabulary.js?v=4.1.3"></script><script src="js/storage.js?v=4.1.3"></script><script src="js/lookup.js?v=4.1.3"></script><script>
(()=>{
  const embedded=new URLSearchParams(location.search).get("embed")==="1";
  const back=document.getElementById("lookupBackBtn");
  if(embedded){
    if(back)back.hidden=true;
    document.addEventListener("click",e=>{
      const a=e.target.closest&&e.target.closest('a[href*="lookup.html?word="]');if(!a)return;
      let u;try{u=new URL(a.href,location.href);}catch(_){return;}
      const w=u.searchParams.get("word");if(!w)return;
      e.preventDefault();e.stopPropagation();parent.postMessage({type:"avs-lookup-open",word:w},location.origin);
    },true);
  }else if(back){
    back.onclick=()=>{try{const r=document.referrer?new URL(document.referrer):null;if(r&&r.origin===location.origin&&history.length>1){history.back();return;}}catch(_){}location.href="index.html?v=4.1.3";};
  }
})();
</script><script>
(()=>{
  const CURRENT_BUILD="4.1.2";
  async function fresh(){
    try{
      const r=await fetch("index.html?buildcheck="+Date.now(),{cache:"no-store"});
      const h=await r.text();
      const m=h.match(/<meta\s+name=["']app-build["']\s+content=["']([^"']+)["']/i);
      if(m&&m[1]&&m[1]!==CURRENT_BUILD){
        const u=new URL(location.href);u.searchParams.set("v",m[1]);u.searchParams.set("_reload",Date.now());
        location.replace(u.toString());
      }
    }catch(_){}
  }
  addEventListener("pageshow",fresh);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")fresh();});
})();
</script></body></html>
